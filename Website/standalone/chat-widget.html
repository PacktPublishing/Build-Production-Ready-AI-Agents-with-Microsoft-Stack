<!-- Claims 365 assistant - standalone.
     Assembled by build_standalone.py from the plugin's assistant.css and
     assistant.js. Edit those and re-run rather than editing this file.

     Paste this whole block into a page. It is self-contained: no build step, no
     framework, no external script, and one fetch to Microsoft when somebody asks a
     question. -->
<div id="ci-assistant">
  <style>
/* Claims 365 assistant - the chat widget.
 *
 * Everything is scoped under #ci-assistant, so nothing here can reach the rest of the page and
 * nothing on the page reaches in. Change the eleven tokens at the top and the whole widget
 * re-skins; there is no other colour anywhere below.
 *
 * SOLID TOKENS ONLY. An earlier draft used a translucent ghost button on the dark header. A
 * contrast checker cannot judge alpha and neither, in practice, can a reader.
 */

#ci-assistant {
  /* --- the palette. Replace these eleven values with your own and stop reading. --- */
  --ink: #12211F;          /* body text */
  --petrol: #0C3B3C;       /* the brand colour: launcher, your own bubbles, links */
  --deep: #08292A;         /* the darker step: panel header, hover states */
  --base: #FAF8F4;         /* the transcript ground */
  --card: #FFFFFF;         /* bubbles, composer */
  --mist: #E7EEEA;         /* quiet fills */
  --parch: #F3E9DA;        /* the notice ground */
  --slate: #4E5E5B;        /* muted text. Darkened until it passes AA on every ground here */
  --ochre: #C8892F;        /* the ONE signal colour. See the note below */
  --ochre-ink: #8A5A12;    /* the same signal as small text, where plain ochre fails AA */
  --ochre-bright: #E9B563; /* the same signal on the dark header */
  --line: #D5DEDB;         /* hairlines */
  --edge: #788B86;         /* control borders. --line is too faint to carry one on its own */
  --head-sub: #CFDCD8;     /* secondary text on the dark header */
  --shadow: 0 18px 48px rgba(8,41,42,.26), 0 2px 6px rgba(8,41,42,.14);

  /* one place for motion, so timing is a decision rather than an accident */
  --fast: .15s; --mid: .24s; --slow: .30s;
  --arrive: cubic-bezier(.22,1,.36,1);   /* decelerating: things coming toward you */
  --leave: cubic-bezier(.4,0,1,1);       /* accelerating: things going away */

  --face: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  --face-title: Georgia, "Iowan Old Style", Palatino, serif;
}

/* OCHRE MARKS EXACTLY ONE THING: that you are signed in. It is worth keeping that discipline.
   Spend it on a chip, a border and a heading as well and it stops meaning anything, and the
   one state a visitor needs to notice becomes just another decorated element. */

#ci-assistant * { box-sizing: border-box; }
#ci-assistant .ci-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* One focus rule for the whole widget, split by ground: petrol reads on the light surfaces,
   ochre-bright on the dark header. */
#ci-assistant :focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; border-radius: 4px; }
#ci-head :focus-visible, #ci-launch:focus-visible { outline: 3px solid var(--ochre-bright); outline-offset: 2px; }

/* ------------------------------------------------------------------------- launcher */

#ci-launch {
  position: fixed; right: 20px; bottom: 20px; z-index: 9990; display: flex;
  align-items: center; gap: 10px; border: 0; cursor: pointer; border-radius: 999px;
  padding: 13px 21px 13px 15px; background: var(--petrol); color: var(--base);
  font: 600 15px/1 var(--face); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--arrive), background var(--fast) linear,
              opacity var(--fast) linear;
}
#ci-launch:hover { transform: translateY(-2px); background: var(--deep); }
#ci-launch:active { transform: translateY(0) scale(.98); }
#ci-launch svg { width: 22px; height: 22px; flex: none; }
#ci-launch[hidden] { display: none; }
/* the launcher drops away as the panel rises, so the two read as one object */
#ci-launch.ci-gone { opacity: 0; transform: translateY(8px) scale(.94); }
/* unread mark, only ever set while the panel is closed */
#ci-launch .ci-dot {
  position: absolute; top: 8px; right: 10px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--ochre); border: 2px solid var(--petrol); display: none;
}
#ci-launch.ci-unread .ci-dot { display: block; }

/* ---------------------------------------------------------------------------- panel */

#ci-panel {
  position: fixed; right: 20px; bottom: 20px; z-index: 9991; width: 416px;
  max-width: calc(100vw - 40px); height: 600px; max-height: calc(100vh - 40px);
  display: flex; flex-direction: column; background: var(--card);
  border: 1px solid var(--line); border-top: 3px solid var(--ochre); border-radius: 14px;
  overflow: hidden; box-shadow: var(--shadow);
  font: 15px/1.55 var(--face); color: var(--ink);
  transform-origin: 100% 100%; opacity: 0; transform: translateY(14px) scale(.97);
  transition: opacity var(--mid) var(--arrive), transform var(--mid) var(--arrive);
}
#ci-panel.ci-shown { opacity: 1; transform: none; }
#ci-panel[hidden] { display: none; }
/* ONE DURATION IN BOTH DIRECTIONS, on purpose. An asymmetric version was tried and reverted:
   changing transition-duration in the same style change that flips the property is at best
   ambiguous for the transition, and the close then leans entirely on the 420ms backstop timer
   in the JS. The exit is not worth a second code path through the one piece of bookkeeping that
   must never fail. If you want asymmetry, change the EASING, never the duration. */

#ci-head {
  display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 18px;
  background: var(--deep); color: var(--base); flex: none;
}
#ci-avatar {
  width: 44px; height: 44px; border-radius: 50%; background: var(--base);
  display: grid; place-items: center; flex: none;
}
#ci-avatar svg { width: 21px; height: 21px; color: var(--petrol); }

/* ------------------------------------------------------------------- the face
   A character, not a logo. The transcript keeps the ARCH mark (#ci-arch) so the two roles stay
   separate: the arch says "the assistant said this", the face says "the assistant is here".

   transform-box matters here and is easy to get wrong. fill-box resolves an origin against the
   ELEMENT's own bounding box, so a prop about seven units wide reads an origin written in
   viewBox units as a point far outside itself and swings off the badge entirely. Anything whose
   origin is written in viewBox coordinates therefore gets view-box; anything that just pivots
   on itself keeps fill-box and plain "center". */
#ci-avatar #ci-face { width: 34px; height: 34px; overflow: visible; }
#ci-face * { transform-box: fill-box; transform-origin: center; }
#ci-face .cif-body, #ci-face .cif-hand { transform-box: view-box; }
#ci-face .cif-ink { fill: var(--petrol); }
#ci-face .cif-cut { fill: none; stroke: var(--base); stroke-width: 1.7; stroke-linecap: round; }
#ci-face .cif-eye { fill: var(--base); }
#ci-face .cif-body { transform-origin: 17.5px 27px; }   /* the neck, so a tilt turns the head */
#ci-face .cif-hand, #ci-face .cif-think, #ci-face .cif-spark { opacity: 0; }
#ci-face .cif-hand { transform-origin: 32.5px 24px; }
#ci-face .cif-hand * { stroke: var(--base); stroke-width: 1.3; paint-order: stroke; }

@keyframes cif-blink { 0%,100% { transform: scaleY(1); } 42%,58% { transform: scaleY(.1); } }
@keyframes cif-nod {
  0%,100% { transform: translateY(0) rotate(0deg); }
  22% { transform: translateY(1.5px) rotate(-5deg); }
  52% { transform: translateY(0) rotate(2.5deg); }
  76% { transform: translateY(1px) rotate(-2deg); }
}
@keyframes cif-glance {
  0%,100% { transform: translateX(0); }
  18%,34% { transform: translateX(-1.8px); }
  54%,72% { transform: translateX(1.8px); }
}
@keyframes cif-tilt { 0%,100% { transform: rotate(0deg); } 22%,72% { transform: rotate(-8deg); } }
@keyframes cif-wave {
  0% { opacity: 0; transform: rotate(0deg); }
  8% { opacity: 1; transform: rotate(-6deg); }
  22% { transform: rotate(-21deg); } 38% { transform: rotate(11deg); }
  54% { transform: rotate(-18deg); } 70% { transform: rotate(7deg); }
  86% { opacity: 1; transform: rotate(-4deg); }
  100% { opacity: 0; transform: rotate(0deg); }
}
@keyframes cif-dot {
  0% { opacity: 0; transform: translateY(2.5px) scale(.5); }
  28% { opacity: 1; transform: translateY(0) scale(1); }
  68% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-2px) scale(.85); }
}
@keyframes cif-pop {
  0% { opacity: 0; transform: scale(.35); }
  32% { opacity: 1; transform: scale(1.12); } 58% { transform: scale(.98); }
  82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); }
}
@keyframes cif-bob {
  0%,100% { transform: translateY(0); } 32% { transform: translateY(-2.2px); }
  64% { transform: translateY(.5px); }
}

#ci-avatar.cif-blink .cif-eyes { animation: cif-blink .26s var(--arrive) both; }
#ci-avatar.cif-nod .cif-body { animation: cif-nod .8s var(--arrive) both; }
#ci-avatar.cif-glance .cif-eyes { animation: cif-glance 1.28s ease-in-out both; }
#ci-avatar.cif-wave .cif-hand { animation: cif-wave 1.18s ease-in-out both; }
#ci-avatar.cif-wave .cif-body { animation: cif-tilt 1.18s var(--arrive) both; }
#ci-avatar.cif-think .cif-body { animation: cif-tilt 1.52s var(--arrive) both; }
#ci-avatar.cif-think .cif-think { opacity: 1; }
#ci-avatar.cif-think .cif-think circle { animation: cif-dot 1.5s ease-in-out both; }
#ci-avatar.cif-think .cif-think circle:nth-child(2) { animation-delay: .13s; }
#ci-avatar.cif-think .cif-think circle:nth-child(3) { animation-delay: .26s; }
#ci-avatar.cif-hi .cif-spark { animation: cif-pop .95s var(--arrive) both; }
#ci-avatar.cif-hi .cif-body { animation: cif-bob .95s var(--arrive) both; }

#ci-title { font: 700 16.5px/1.25 var(--face-title); margin: 0; }
#ci-status {
  font-size: 12.5px; color: var(--head-sub); margin-top: 2px;
  display: flex; align-items: center; gap: 6px;
}
#ci-status .ci-pip { width: 7px; height: 7px; border-radius: 50%; background: var(--head-sub); flex: none; }
#ci-status.ci-on .ci-pip { background: var(--ochre-bright); }   /* the one ochre signal */
#ci-min {
  margin-left: auto; background: #14413F; color: var(--base); border: 0;
  width: 36px; height: 36px; border-radius: 9px; cursor: pointer; flex: none;
  display: grid; place-items: center; transition: background var(--fast) linear;
}
#ci-min:hover { background: #1B5250; }
#ci-min svg { width: 18px; height: 18px; }

/* ----------------------------------------------------------------------- transcript */

/* Deliberately NOT scroll-behavior: smooth. A smooth scroll is still travelling when the next
   activity lands, so the "is the reader at the bottom" test reads a mid-flight position,
   decides no, and auto-follow dies for the rest of a multi-part answer. Measured. The bubble
   animates; the scroll is instant. */
#ci-log {
  flex: 1; overflow-y: auto; padding: 18px; background: var(--base);
  display: flex; flex-direction: column; gap: 10px;
}
#ci-assistant .ci-row {
  display: flex; gap: 9px; align-items: flex-end;
  transition: opacity var(--mid) var(--arrive), transform var(--mid) var(--arrive);
}
#ci-assistant .ci-row.ci-pre { opacity: 0; transform: translateY(8px); }
#ci-assistant .ci-row-me { justify-content: flex-end; }
#ci-assistant .ci-row-sys { justify-content: center; }
#ci-assistant .ci-av {
  width: 28px; height: 28px; flex: none; border-radius: 50%;
  background: var(--mist); border: 1px solid var(--line); display: grid; place-items: center;
}
#ci-assistant .ci-av svg { width: 15px; height: 15px; color: var(--petrol); }
#ci-assistant .ci-cont .ci-av { visibility: hidden; }
#ci-assistant .ci-b {
  max-width: 100%; padding: 11px 14px; border-radius: 16px; font-size: 15px;
  line-height: 1.55; overflow-wrap: anywhere;
}
#ci-assistant .ci-plain { white-space: pre-wrap; }
#ci-assistant .ci-bot {
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-bottom-left-radius: 5px;
}
#ci-assistant .ci-me {
  background: var(--petrol); color: var(--base); border-bottom-right-radius: 5px;
}
#ci-assistant .ci-row-bot .ci-b { max-width: calc(100% - 37px); }
#ci-assistant .ci-row-me .ci-b { max-width: 86%; }

/* rich model output */
#ci-assistant .ci-b p { margin: 0 0 .62em; }
#ci-assistant .ci-b p:last-child { margin-bottom: 0; }
#ci-assistant .ci-b ul, #ci-assistant .ci-b ol { margin: .15em 0 .62em; padding-left: 1.2em; }
#ci-assistant .ci-b ul:last-child, #ci-assistant .ci-b ol:last-child { margin-bottom: 0; }
#ci-assistant .ci-b li { margin: .2em 0; }
#ci-assistant .ci-b li::marker { color: var(--ochre-ink); }
#ci-assistant .ci-b .ci-h { font-size: .95em; }
#ci-assistant .ci-bot strong { color: var(--petrol); }
#ci-assistant .ci-b code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .9em; background: var(--mist); color: var(--ink); padding: .1em .35em; border-radius: 4px;
}
#ci-assistant .ci-bot a { color: var(--petrol); text-decoration: underline; }
#ci-assistant .ci-me a { color: var(--ochre-bright); text-decoration: underline; }

/* widget-authored notices: never dressed as something the model said */
#ci-assistant .ci-sys {
  align-self: center; max-width: 94%; background: var(--parch);
  border-top: 3px solid var(--ochre); border-radius: 10px; padding: 9px 13px;
  font-size: 13.5px; line-height: 1.5; color: var(--ink);
}
#ci-assistant .ci-sys b { color: var(--ochre-ink); }

#ci-assistant .ci-dots { display: flex; gap: 5px; align-items: center; padding: 13px 15px; }
#ci-assistant .ci-dots i {
  width: 7px; height: 7px; border-radius: 50%; background: var(--slate);
  animation: ci-bounce 1.1s infinite;
}
#ci-assistant .ci-dots i:nth-child(2) { animation-delay: .15s; }
#ci-assistant .ci-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes ci-bounce {
  0%,60%,100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}
@keyframes ci-spin { to { transform: rotate(360deg); } }

/* The chips ride with the greeting INSIDE the transcript rather than sitting in a fixed strip:
   as a strip they were stranded at the foot of an empty panel with a hole above them. */
#ci-chips {
  padding: 0 18px 12px; background: var(--base); display: flex; flex-wrap: wrap; gap: 7px; flex: none;
}
#ci-chips.ci-inlog { padding: 0 0 0 37px; background: transparent; margin-top: -2px; }
#ci-chips[hidden] { display: none; }
#ci-assistant .ci-chip {
  background: var(--card); color: var(--petrol); border: 1px solid var(--edge);
  border-radius: 9px; padding: 8px 12px; cursor: pointer;
  /* Longhands: `inherit` is not allowed inside the `font` shorthand, so the browser ignores it. */
  font-family: inherit; font-weight: 500; font-size: 13.5px; line-height: 1.3;
  text-align: left; transition: background var(--fast) linear, transform var(--fast) var(--arrive);
  opacity: 0; transform: translateY(6px); animation: ci-chip-in var(--mid) var(--arrive) forwards;
}
#ci-assistant .ci-chip:nth-child(2) { animation-delay: .06s; }
#ci-assistant .ci-chip:nth-child(3) { animation-delay: .12s; }
#ci-assistant .ci-chip:nth-child(4) { animation-delay: .18s; }
@keyframes ci-chip-in { to { opacity: 1; transform: none; } }
#ci-assistant .ci-chip:hover { background: var(--mist); }
#ci-assistant .ci-chip:active { transform: scale(.98); }
#ci-assistant .ci-chip[aria-disabled="true"] { cursor: default; color: var(--slate); }
/* once staggered in, stay in: showing the panel again restarts CSS animations */
#ci-assistant .ci-settled .ci-chip { animation: none; opacity: 1; transform: none; }

/* ------------------------------------------------------------------------- composer */

#ci-foot { border-top: 1px solid var(--line); background: var(--card); padding: 12px 14px; flex: none; }
#ci-row { display: flex; gap: 8px; align-items: center; }
#ci-q {
  flex: 1; font: inherit; padding: 11px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--edge); border-radius: 999px;
}
#ci-q::placeholder { color: var(--slate); opacity: 1; }
#ci-q:focus { border-color: var(--petrol); }
#ci-send {
  border: 0; border-radius: 50%; width: 44px; height: 44px; flex: none; cursor: pointer;
  background: var(--petrol); color: var(--base); display: grid; place-items: center;
  transition: background var(--fast) linear, transform var(--fast) var(--arrive);
}
#ci-send:hover { background: var(--deep); }
#ci-send:active { transform: scale(.94); }
#ci-send[aria-disabled="true"] { background: var(--slate); cursor: default; transform: none; }
#ci-send svg { width: 19px; height: 19px; }
#ci-send.ci-busy svg { display: none; }
#ci-send.ci-busy::after {
  content: ""; width: 17px; height: 17px; border-radius: 50%;
  border: 2px solid var(--base); border-top-color: var(--slate);
  animation: ci-spin .7s linear infinite;
}
#ci-auth {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 10px; font-size: 12.5px; color: var(--slate);
}
#ci-auth button {
  border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  font-family: inherit; font-weight: 600; font-size: 13px; line-height: 1;
  background: var(--petrol); color: var(--base);
  transition: background var(--fast) linear;
}
#ci-auth button:hover { background: var(--deep); }
#ci-auth button.ci-quiet { background: var(--mist); color: var(--petrol); }
#ci-auth button.ci-quiet:hover { background: #D6E4DF; }

/* ---------------------------------------------------------------- the other renderings */

@media (forced-colors: active) {
  #ci-panel, #ci-assistant .ci-b, #ci-assistant .ci-av, #ci-assistant .ci-chip,
  #ci-assistant .ci-sys { border: 1px solid CanvasText; }
  #ci-assistant .ci-dots i { background: CanvasText; }
  /* a busy control must not look identical to a ready one when our palette is discarded */
  #ci-send[aria-disabled="true"], #ci-assistant .ci-chip[aria-disabled="true"] {
    color: GrayText; border-color: GrayText;
  }
}

/* coarse pointers: min-height rather than padding arithmetic, so the 44px is a fact */
@media (pointer: coarse) {
  #ci-min { width: 44px; height: 44px; }
  #ci-assistant .ci-chip { padding: 11px 14px; min-height: 44px; }
  #ci-auth button { padding: 12px 16px; min-height: 44px; }
  #ci-q { min-height: 44px; }
}

@media (max-width: 480px) {
  /* Pin both edges rather than width:100vw - 100vw counts the scrollbar, so on a narrow desktop
     window the sheet hangs off the right by the scrollbar's width. */
  #ci-panel {
    left: 0; right: 0; bottom: 0; width: auto; max-width: none;
    height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh;
    border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0;
    transform: translateY(26px);   /* a full-height sheet slides; scaling from a corner is a desktop gesture */
  }
  #ci-panel.ci-shown { transform: none; }
  #ci-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #ci-q { font-size: 16px; }       /* 16px stops iOS zooming the page when the composer takes focus */
  #ci-launch { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); }
}

/* Reduced motion is a DIFFERENT DESIGN, not a broken one: every state change stays legible,
   only travel and scale are dropped. Durations collapse rather than going to zero so the
   transitionend that ends a close still fires. */
@media (prefers-reduced-motion: reduce) {
  #ci-assistant { --fast: 1ms; --mid: 1ms; --slow: 1ms; }
  #ci-assistant * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
  #ci-panel, #ci-panel.ci-shown { transform: none; }
  #ci-assistant .ci-row.ci-pre { transform: none; }
  #ci-launch:hover, #ci-launch:active, #ci-send:active, #ci-assistant .ci-chip:active { transform: none; }
  #ci-launch.ci-gone { transform: none; }
  #ci-assistant .ci-chip { opacity: 1; transform: none; }
  /* The face is pure decoration, so it simply stops. The JS scheduler also refuses to start
     under this query, and the props stay hidden rather than snapping into view. */
  #ci-face * { animation: none !important; }
  #ci-avatar.cif-think .cif-think { opacity: 0; }
  /* The two PROGRESS signals keep moving, a little slower. Freezing them would leave a reader
     with no sign that anything is happening, which is a worse outcome than the motion; both are
     small, local, and not the kind of travel that triggers anybody. */
  #ci-assistant .ci-dots i {
    animation: ci-bounce 1.7s infinite !important; animation-iteration-count: infinite !important;
  }
  #ci-send.ci-busy::after {
    animation: ci-spin 1.2s linear infinite !important; animation-iteration-count: infinite !important;
  }
}

/* The administrator-only "not configured yet" notice from the shortcodes. */
.c365a-setup {
  border: 1px solid #D5DEDB; border-top: 3px solid #C8892F; border-radius: 10px;
  background: #F3E9DA; padding: 18px 20px; margin: 8px 0 28px; color: #12211F;
  font: 15px/1.55 system-ui, sans-serif;
}
.c365a-setup p { margin: 0 0 .5em; }
.c365a-setup-note { font-size: .85rem; color: #4E5E5B; margin-bottom: 0 !important; }

  </style>

  <button type="button" id="ci-launch"
          aria-expanded="false" aria-haspopup="dialog" aria-controls="ci-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.9 9.9 0 0 1-2.8-.4L3 21l1.6-4.7A8.2 8.2 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8.4 8.4z"/>
    </svg>
    <span>Ask us</span>
    <span class="ci-sr" id="ci-launchsr"> - the assistant</span>
    <span class="ci-dot" aria-hidden="true"></span>
  </button>

  <div id="ci-panel" hidden role="dialog" aria-labelledby="ci-title">
    <div id="ci-head">
      <div id="ci-avatar" aria-hidden="true">
        <svg id="ci-face" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <g class="cif-body">
            <path class="cif-ink" d="M4 35v-1.7c0-5.1 6-8.3 13.5-8.3S31 28.2 31 33.3V35z"/>
            <circle class="cif-ink" cx="17.5" cy="15.5" r="8"/>
            <g class="cif-eyes">
              <circle class="cif-eye" cx="14.7" cy="15" r="1.75"/>
              <circle class="cif-eye" cx="20.3" cy="15" r="1.75"/>
            </g>

      } else if (m[3]) {                 /* [label](url) */

    if (faceLast !== "cif-blink") {

    var guard = 0;

    faceLast = pick.c;
    facePlay(pick.c, pick.ms);
    faceSoon(2700, 5400);
  }
  function faceStop() {
    if (faceTimer !== null) { clearTimeout(faceTimer); faceTimer = null; }
    if (faceEnd !== null) { clearTimeout(faceEnd); faceEnd = null; }
    faceOff();
  }
  function faceThink(on) {
    faceBusy = on;
    if (!faceAwake()) { return; }
    if (on) { facePlay("cif-think", 1540); faceSoon(1650, 1950); }
    else { facePlay("cif-nod", 820); faceSoon(2600, 4400); }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { faceStop(); return; }
    if (panelOpen) { faceSoon(900, 2000); }
  });

  function open_(on) {
    var p = $("ci-panel"), l = $("ci-launch");
    panelOpen = on;
    try { sessionStorage.setItem("ci_open", on ? "1" : "0"); } catch (e) {}
    l.setAttribute("aria-expanded", on ? "true" : "false");
    if (on) {
      if (closeTimer !== null) { clearTimeout(closeTimer); closeTimer = null; }
      p.removeAttribute("inert");
      unread(false);
      l.classList.add("ci-gone");
      setTimeout(function () {
        if (p.classList.contains("ci-shown")) { l.hidden = true; }
      }, 150);
      p.hidden = false;
      void p.offsetWidth;                 /* start from the collapsed state, then transition */
      p.classList.add("ci-shown");
      /* the face says hello with the panel, then settles into its idle loop */
      faceLast = "";
      facePlay("cif-hi", 970);
      faceSoon(1500, 2700);
      if (!greeted) { greeted = true; greet(); }
      toBottom();                        /* reopening lands on the newest reply, not where you left */
      setTimeout(function () {
        try { $("ci-q").focus({ preventScroll: true }); } catch (e) { $("ci-q").focus(); }
      }, 120);
    } else {
      p.classList.remove("ci-shown");
      p.setAttribute("inert", "");
      faceStop();                        /* nothing keeps ticking behind a closed panel */
      l.hidden = false;
      void l.offsetWidth;
      l.classList.remove("ci-gone");
      closeTimer = setTimeout(settleClosed, 420);
      try { l.focus({ preventScroll: true }); } catch (e) { l.focus(); }
    }
  }

  function greet() {
    /* a short typing beat before the first line: the assistant reads as present rather than as
       a block of text that was always there */
    thinking(true);
    setTimeout(function () {
      thinking(false);
      say("bot", CFG.greeting);
      chipsIntoLog();                          /* the suggestions follow the greeting */
      toBottom();
    }, 480);
  }

  /* The suggestions live in the transcript, so they scroll away with the greeting on their own.
     They are NOT hidden after the first question: keeping them costs nothing once they have
     scrolled up. `.ci-settled` stops the stagger replaying every time the panel is shown again -
     display:none to display:flex restarts CSS animations. */
  function chipsIntoLog() {
    var c = $("ci-chips");
    if (!c) { return; }
    if (!c.children.length) { c.hidden = true; return; }
    c.className = "ci-inlog";
    $("ci-log").appendChild(c);
    setTimeout(function () { c.className = "ci-inlog ci-settled"; }, 500);
  }

  /* ================= transport ================= */

  function b64url(buf) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function redirectUri() { return location.origin + location.pathname; }
  function saveConv() {
    try {
      sessionStorage.setItem("ci_conv", JSON.stringify(
        { dl: dl, conv: conv, ctok: ctok, wm: wm, sas: sas }));
    } catch (e) {}
  }

  async function jget(u, tok) {
    var h = {}; if (tok) h.Authorization = "Bearer " + tok;
    try {
      var r = await fetch(u, { headers: h });
      return r.ok ? r.json() : null;
    } catch (e) { return null; }
  }
  async function jpost(u, body, tok) {
    var h = { "Content-Type": "application/json" };
    if (tok) h.Authorization = "Bearer " + tok;
    try {
      var r = await fetch(u, { method: "POST", headers: h, body: JSON.stringify(body || {}) });
      if (!r.ok) return null;
      try { return await r.json(); } catch (e2) { return {}; }
    } catch (e) { return null; }
  }

  /* Both of these land in a URL path, so both are shape-checked even though they come from
     this site's own settings. Cheap, and it turns a mistyped setting into a widget that does
     not open a conversation rather than a malformed request. */
  function activeSchema() {
    if (!/^[A-Za-z0-9_]{1,128}$/.test(CFG.schema)) { return ""; }
    return CFG.schema;
  }
  function activeEnv() {
    var h = C.envHost || "";
    if (!/^[A-Za-z0-9.\-]{10,120}\.environment\.api\.powerplatform\.com$/.test(h)) { return ""; }
    return "https://" + h;
  }

  /* WHERE A CUSTOMER'S TOKEN MAY BE POSTED.
     The OAuth card hands us a URL and we POST the signed-in visitor's access token to it.
     Whatever produced that card therefore chooses the destination, so the host is checked
     against Microsoft's own before the token leaves the browser: an agent that returned a
     third-party sasUrl would otherwise be handed a live credential. The list is deliberately
     generous - it is here to refuse somebody else's domain, not to pin one hostname - so if
     sign-in ever fails with the console warning below, widen it rather than removing it. */
  var TOKEN_POST_HOSTS = /(^|\.)(botframework\.com|powerplatform\.com|microsoft\.com|azure\.com|dynamics\.com)$/i;
  function tokenPostOk(url) {
    if (!url) { return false; }
    var host = "";
    try {
      var parsed = new URL(String(url));
      if (parsed.protocol !== "https:") { return false; }
      host = parsed.hostname;
    } catch (e) { return false; }
    if (TOKEN_POST_HOSTS.test(host)) { return true; }
    try { console.warn("claims365 assistant: refused a token post to " + host); } catch (e2) {}
    return false;
  }

  async function connect() {
    var env = activeEnv(), schema = activeSchema();
    if (!env) { throw new Error("the environment host is not set correctly"); }
    if (!schema) { throw new Error("the agent name is not set correctly"); }
    var t = await jget(env + "/powervirtualagents/botsbyschema/" + schema
                       + "/directline/token?" + CFG.apiv);
    if (!t) throw new Error("the assistant is unavailable");
    /* The Direct Line base URL is REGIONAL and comes from the environment, not from a constant.
       The public default below is the fallback, not the answer. */
    var rcs = await jget(env + "/powervirtualagents/regionalchannelsettings?" + CFG.apiv);
    var baseUrl = ((rcs || {}).channelUrlsById || {}).directline;
    if (!baseUrl) baseUrl = "https://directline.botframework.com/";
    dl = baseUrl.replace(/\/$/, "") + "/v3/directline";
    var c = await jpost(dl + "/conversations", {}, t.token);
    if (!c) throw new Error("the assistant is unavailable");
    conv = c.conversationId; ctok = c.token || t.token; wm = null;
    await jpost(dl + "/conversations/" + conv + "/activities",
      { type: "event", name: "startConversation", from: { id: "web", role: "user" },
        channelData: { postBack: true } }, ctok);
    ready = true; saveConv();
    await pump(6000, false);        /* swallow the platform greeting, we print our own */
  }

  /* Poll one turn. NEVER calls sendRaw - nested pumps used to share the watermark and swallow
     each other's activities, which is why answers went missing. It only collects, renders, and
     passes the visitor's token through an OAuth card if one arrives. */
  async function pump(maxMs, render) {
    var end = Date.now() + maxMs;
    var texts = [];
    var lastText = 0;
    while (Date.now() < end) {
      await sleep(1200);
      var u = dl + "/conversations/" + conv + "/activities";
      if (wm) u = u + "?watermark=" + wm;
      var a = await jget(u, ctok);
      if (!a) continue;
      wm = a.watermark || wm; saveConv();
      var acts = a.activities || [];
      for (var k = 0; k < acts.length; k++) {
        var act = acts[k];
        if ((act.from || {}).role !== "bot") continue;   /* trap 2: only the bot carries "bot" */
        var atts = act.attachments || [];
        for (var j = 0; j < atts.length; j++) {
          if ((atts[j].contentType || "").indexOf("oauth") < 0) continue;
          var cc = atts[j].content || {};
          var url = (cc.tokenPostResource || {}).sasUrl;
          if (tokenPostOk(url)) { sas = url; saveConv(); }
          if (custToken) {
            if (sas) {
              await fetch(sas, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: custToken })
              });
              authPassed = true;
            }
          } else if (AUTH) {
            sys("To look that up I need you to sign in. Use Sign in just below.");
          } else {
            sys("That needs a signed-in account, and this page does not offer sign-in.");
          }
        }
        if (act.text) {
          texts.push(act.text);
          lastText = Date.now();
          if (render) {
            thinking(false);        /* the answer replaces the dots rather than following them */
            say("bot", act.text);
          }
        }
      }
      /* Trap 4: end of turn is inferred from silence. */
      if (texts.length) {
        if (Date.now() - lastText > 3200) break;
      }
    }
    return texts;
  }

  /* Post one message into the conversation. A Direct Line conversation and its token expire
     (the token after about an hour), and an expired one refuses the post. Without this every
     later question would get "no answer", so open a fresh conversation and send once more. */
  async function postMessage(q) {
    var msg = { type: "message", text: q, locale: "en-GB", from: { id: "web", role: "user" } };
    if (await jpost(dl + "/conversations/" + conv + "/activities", msg, ctok)) { return; }
    ready = false;
    await connect();
    if (!(await jpost(dl + "/conversations/" + conv + "/activities", msg, ctok))) {
      throw new Error("the assistant is unavailable");
    }
  }

  async function sendRaw(q, render) {
    authPassed = false;
    await postMessage(q);
    if (render) thinking(true);
    var got = await pump(45000, render);
    if (!got.length) {
      /* The turn was consumed by the sign-in card. Now that the token is in, ask once more. */
      if (authPassed) {
        if (render) { thinking(true); }
        await postMessage(q);
        got = await pump(45000, render);
      }
    }
    if (render) thinking(false);
    return got;
  }

  /* ================= customer sign-in (optional) ================= */

  async function signIn() {
    if (!AUTH) { return; }
    var v = b64url(crypto.getRandomValues(new Uint8Array(32)));
    /* The PKCE verifier MUST survive the round trip. If storage is unavailable - private mode,
       blocked cookies - say so HERE rather than failing after the redirect, where the reader has
       left the site and cannot see any message we might print. */
    try {
      sessionStorage.setItem("ci_v", v);
      sessionStorage.setItem("ci_open", "1");
    } catch (e) {
      throw new Error("this browser is blocking site storage, which sign-in needs. Try a "
                    + "normal window rather than a private one.");
    }
    saveConv();
    var c = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)));
    var p = new URLSearchParams({
      client_id: AUTH.clientId, response_type: "code", redirect_uri: redirectUri(),
      scope: AUTH.scopes, code_challenge: c, code_challenge_method: "S256",
      response_mode: "query"
    });
    location.href = AUTH.authority + "/oauth2/v2.0/authorize?" + p;
  }

  async function finishSignIn(code) {
    if (!AUTH) { return; }
    var body = new URLSearchParams({
      client_id: AUTH.clientId, grant_type: "authorization_code", code: code,
      code_verifier: sessionStorage.getItem("ci_v"), redirect_uri: redirectUri(),
      scope: AUTH.scopes
    });
    var r = await fetch(AUTH.authority + "/oauth2/v2.0/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });
    var t = await r.json();
    if (!t.access_token) throw new Error(t.error_description || "sign-in failed");
    custToken = t.access_token;
    custName = "your account";
    try {
      var c = JSON.parse(atob(t.id_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      custName = c.name || c.preferred_username || "your account";
    } catch (e) {}
    history.replaceState({}, "", location.pathname);
    paint();
    /* Holding a token on the page is not enough - trap 3. The AGENT conversation must be signed
       in too, and only an OAuthInput node prompts for that. Prime it silently. */
    try {
      if (!ready) await connect();
      await sendRaw(AUTH.prime, false);
    } catch (e) {}
    sys("Thanks, you are signed in as " + custName + ". Ask about your own records.");
  }

  function paint() {
    if (!AUTH) { return; }
    var signedIn = custToken ? true : false;
    $("ci-statust").textContent = signedIn ? "Signed in as " + custName : "Not signed in";
    if (signedIn) { $("ci-status").classList.add("ci-on"); }
    else { $("ci-status").classList.remove("ci-on"); }
    $("ci-authnote").textContent = signedIn
      ? "You will only see records on this account"
      : "Sign in to ask about your own records";
    /* Hiding the control that currently holds focus would drop a keyboard user back to the top
       of the document, so hand focus to its replacement first. */
    var active = document.activeElement;
    var losing = signedIn ? $("ci-in") : $("ci-out");
    $("ci-in").hidden = signedIn;
    $("ci-out").hidden = !signedIn;
    if (active === losing) {
      var gaining = signedIn ? $("ci-out") : $("ci-in");
      try { gaining.focus({ preventScroll: true }); } catch (e) { gaining.focus(); }
    }
  }

  /* ================= asking ================= */

  async function ask(text) {
    if (sending) { return; }              /* one turn at a time: see busy() */
    var q = (text !== undefined ? text : $("ci-q").value).trim();
    if (!q) { return; }
    $("ci-q").value = "";
    $("ci-alert").textContent = "";       /* so an identical failure announces again */
    say("me", q);
    busy(true);
    /* The dots go up BEFORE connect(): the first question of a session also pays for the Direct
       Line handshake, and a motionless panel reads as a broken one. */
    thinking(true);
    try {
      if (!ready) { await connect(); }
      var got = await sendRaw(q, true);
      if (!got.length) { sys("I did not get an answer that time. Please try again."); }
    } catch (e) {
      fail("Sorry, I could not reach the assistant just now. " + e.message);
    }
    thinking(false);
    busy(false);
  }

  function unread(on) {
    var l = $("ci-launch");
    if (on) { l.classList.add("ci-unread"); } else { l.classList.remove("ci-unread"); }
    var sr = $("ci-launchsr");
    if (sr) {
      sr.textContent = on ? " - new reply waiting" : " - the assistant";
    }
  }

  /* ================= wiring ================= */

  $("ci-launch").onclick = function () { open_(true); };
  $("ci-min").onclick = function () { open_(false); };
  /* One funnel ends a close, whichever gets there first (see settleClosed). */
  $("ci-panel").addEventListener("transitionend", function (e) {
    if (e.target !== $("ci-panel")) { return; }
    if (e.propertyName !== "opacity") { return; }
    settleClosed();
  });
  document.addEventListener("keydown", function (e) {
    if (e.isComposing) { return; }        /* mid IME composition: Escape belongs to the IME */
    if (e.keyCode === 229) { return; }
    if (e.key !== "Escape") { return; }
    if ($("ci-panel").hidden) { return; }
    open_(false);
  });
  /* No sign-in configured means no sign-in ROW. The WordPress shortcode already omits it, but
     the standalone file ships the markup with a "delete this if you are not using it" comment,
     and a Sign in button that does nothing when clicked is worse than no button. Hide it here so
     the two paths cannot disagree. */
  if (!AUTH) {
    var authRow = $("ci-auth");
    if (authRow) { authRow.hidden = true; authRow.style.display = "none"; }
  }
  if (AUTH) {
    $("ci-in").onclick = function () { signIn().catch(function (e) { fail(e.message); }); };
    $("ci-out").onclick = function () {
      custToken = null; custName = null; paint();
      /* Sign-out has to tear down the CONVERSATION, not just our copy of the token. The Direct
         Line conversation was signed in separately (that is what the priming message is for),
         so leaving conv/ctok/sas alive means the agent still answers personal questions for the
         visitor who just signed out - while the panel says they are signed out. The next
         question starts a fresh conversation. */
      ready = false; conv = null; ctok = null; wm = null; sas = null; authPassed = false;
      /* Drop the stored transcript too. What is on screen stays, because wiping the panel
         mid-conversation is startling, but a later reload must not replay one person's details
         to whoever opens the page next on a shared machine. */
      hist = [];
      try {
        sessionStorage.removeItem("ci_hist");
        sessionStorage.removeItem("ci_conv");
      } catch (e) {}
      sys("You are signed out. I can still answer general questions.");
    };
  }
  $("ci-send").onclick = function () { ask(); };
  $("ci-q").addEventListener("keydown", function (e) {
    if (e.isComposing) { return; }        /* Enter is committing a candidate, not sending */
    if (e.keyCode === 229) { return; }
    if (e.key === "Enter") { e.preventDefault(); ask(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#ci-assistant .ci-chip"), function (c) {
    c.onclick = function () { ask(c.textContent); };
  });
  /* Let anything on the page open the panel: <a href="#claims-assistant"> or class="ci-open". */
  Array.prototype.forEach.call(
    document.querySelectorAll('a[href="#claims-assistant"],.ci-open'), function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); open_(true); });
    });

  /* Signing in leaves and re-enters the page, and the conversation id already survives that.
     The words on screen did not, so the reader came back to an empty panel and a repeated
     greeting. Replay what was said, unanimated. */
  function replay() {
    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("ci_hist") || "null"); } catch (e) {}
    if (!saved) { return false; }
    if (!saved.length) { return false; }
    hist = saved;
    for (var i = 0; i < saved.length; i++) {
      var it = saved[i];
      if (it.w === "sys") { paint_sys(it.t, false); } else { paint_msg(it.w, it.t, false); }
    }
    toBottom();
    return true;
  }

  paint();
  if (replay()) {
    greeted = true;                       /* do not greet a reader we have already greeted */
    chipsIntoLog();                       /* suggestions belong with the transcript */
    toBottom();
  }
  var code = AUTH ? new URLSearchParams(location.search).get("code") : null;
  var wasOpen = false;
  try { wasOpen = sessionStorage.getItem("ci_open") === "1"; } catch (e) {}
  if (code) {
    open_(true);
    try {
      var saved2 = JSON.parse(sessionStorage.getItem("ci_conv") || "null");
      if ((saved2 || {}).conv) {
        dl = saved2.dl; conv = saved2.conv; ctok = saved2.ctok; wm = saved2.wm;
        /* re-checked on the way back in: storage is not a trust boundary either */
        sas = tokenPostOk(saved2.sas) ? saved2.sas : null;
        ready = true;
      }
    } catch (e) {}
    finishSignIn(code).catch(function (e) { fail(e.message); });
  } else if (wasOpen) {
    open_(true);
  }
})();
</script>
